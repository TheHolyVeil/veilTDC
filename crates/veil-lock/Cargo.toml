[package]
name        = "veil-lock"
version     = "0.1.0"
edition     = "2021"
description = "Session lock screen for Veil: an ext-session-lock-v1 client with PAM authentication"

[dependencies]
veil-ui                = { path = "../veil-ui" }
veil-palette           = { path = "../veil-palette" }
tiny-skia              = { workspace = true }
smithay-client-toolkit = { workspace = true }
wayland-client         = { workspace = true }
rustix                 = { workspace = true }
pam-client2            = { workspace = true }
uzers                  = { workspace = true }
zeroize                = { workspace = true }
image                  = { workspace = true, features = ["png", "jpeg"] }
zbus                   = { workspace = true }
chrono                 = { workspace = true }
tracing                = { workspace = true }
tracing-subscriber     = { workspace = true }
