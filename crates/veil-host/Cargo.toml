[package]
name    = "veil-host"
version = "4.0.2"
edition = "2021"

# Nested headless Wayland compositor. Hosts one client, exposes its own
# WAYLAND_DISPLAY socket. Runs alongside any other compositor (or none).

[lib]

[[bin]]
name = "veil-host"
path = "src/main.rs"

[dependencies]
smithay            = { workspace = true }
calloop            = { workspace = true }
tracing            = { workspace = true }
chrono             = { workspace = true }
veil-render        = { path = "../veil-render" }
veil-config        = { path = "../veil-config" }
veil-ipc           = { path = "../veil-ipc" }
serde              = { workspace = true }
serde_json         = { workspace = true }
crossterm          = { workspace = true }
evdev              = { workspace = true }
drm                = { workspace = true }
libseat            = { workspace = true }
libc               = { workspace = true }
# Wallpaper decode: PNG + JPEG only, same minimal surface as veil-login.
image              = { workspace = true, features = ["png", "jpeg"] }
wayland-protocols  = { workspace = true }
wayland-server     = { workspace = true }
tracing-subscriber = { workspace = true }
wl-clipboard-rs    = { workspace = true }
mimalloc           = { workspace = true }

[dev-dependencies]
tempfile           = { workspace = true }
