[package]
name        = "veil-power"
version     = "0.1.0"
edition     = "2021"
description = "Supervised power menu overlay for Veil"

[dependencies]
veil-ui                = { path = "../veil-ui" }
veil-text              = { path = "../veil-text" }
veil-ipc               = { path = "../veil-ipc" }
veil-palette           = { path = "../veil-palette" }
tiny-skia              = { workspace = true }
smithay-client-toolkit = { workspace = true }
wayland-client         = { workspace = true }
wayland-protocols      = { workspace = true, features = ["client", "staging"] }
wayland-protocols-wlr  = { workspace = true, features = ["client"] }
tracing                = { workspace = true }
tracing-subscriber     = { workspace = true }
rustix                 = { workspace = true }
libc                   = { workspace = true }
serde_json             = { workspace = true }

[dev-dependencies]
tempfile               = { workspace = true }
