[package]
name    = "veil-login"
version = "0.1.0"
edition = "2021"

# Velogin: graphical TTY login manager for the Veil ecosystem.
# Slint UI on DRM/KMS (no X11/Wayland needed), PAM auth, session spawn.

[[bin]]
name = "velogin"
path = "src/main.rs"

[dependencies]
slint = { workspace = true, features = [
    "std",
    "compat-1-2",
    "backend-winit",        # nested dev/testing inside a compositor
    "backend-linuxkms",     # bare-TTY DRM/KMS via libseat
    "renderer-femtovg",     # GPU (EGL/GBM) — 6600 XT and most desktops
    "renderer-software",    # fallback for weak/embedded hardware
] }
pam-client2 = { workspace = true }
# Pre-auth decoder runs as root on untrusted files: PNG + JPEG only (LG7).
image       = { workspace = true, features = ["png", "jpeg"] }
uzers       = { workspace = true }
thiserror   = { workspace = true }
libc        = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }
